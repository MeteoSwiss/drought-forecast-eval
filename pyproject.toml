[project]
dynamic = ["version"]
name = "drought-forecast-eval"
description = "Verification library for drought forecasts on www.drought.admin.ch"
license = "MIT"
readme = "README.md"
authors = [{ name = "MeteoSwiss Divisions SEK and SEP" }]
keywords = ["drought", "forecast", "verification", "Switzerland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "xarray>=2024.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scores>=1.5",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "netCDF4>=1.7",
    "requests>=2.31",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "click>=8.1",
]

[project.scripts]
drought-eval = "scripts.run_verification:cli"

[project.urls]
Repository = "https://github.com/MeteoSwiss/drought-forecast-eval/"
Documentation = "https://github.com/MeteoSwiss/drought-forecast-eval/docs"

# ---------------------------------------------------------------------------
# Dependency groups
# ---------------------------------------------------------------------------
[dependency-groups]
report = [
    "jinja2>=3.1",
    "weasyprint>=62",
]
notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "nbformat>=5.9",
]
doc = [
    "pydata-sphinx-theme>=0.16.1,<0.17.0",
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-autoapi>=3.6.0,<4.0.0",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jinja2>=3.1",  # needed for HTML export in tests
    { include-group = "report" },
    { include-group = "notebook" },
]

# ---------------------------------------------------------------------------
# Poetry configuration
# ---------------------------------------------------------------------------
[tool.poetry]
requires-poetry = ">=2.0,<3.0"
version = "0.0.0"  # DO NOT SET. The version of the package is always set by the CI/CD pipeline.
packages = [{ include = "drought_forecast_eval" }]
include = ["CHANGELOG.rst"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
ignore = ["D203", "D212", "ANN101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=drought_forecast_eval --cov-report=term-missing -v"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
