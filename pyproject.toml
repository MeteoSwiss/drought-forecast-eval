[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "drought-forecast-eval"
version = "0.1.0"
description = "Verification and evaluation library for Swiss drought forecasts"
readme = "README.md"
license = "MIT"
authors = ["MeteoSwiss Climate Analysis"]
keywords = ["drought", "forecast", "verification", "xarray", "Switzerland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
packages = [{ include = "drought_forecast_eval" }]

[tool.poetry.scripts]
drought-eval = "scripts.run_verification:cli"

[tool.poetry.urls]
Repository = "https://service.meteoswiss.ch/git/climateanalysis/collab/drought-forecast-eval"
Documentation = "https://service.meteoswiss.ch/git/climateanalysis/collab/drought-forecast-eval/-/tree/main/docs"

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python     = ">=3.11,<3.13"
xarray     = ">=2024.0"
pandas     = ">=2.0"
numpy      = ">=1.26"
scores     = ">=1.5"
geopandas  = ">=0.14"
matplotlib = ">=3.8"
netCDF4    = ">=1.7"
requests   = ">=2.31"
scipy      = ">=1.12"
scikit-learn = ">=1.4"
click        = ">=8.1"

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[tool.poetry.group.report]
optional = true

[tool.poetry.group.report.dependencies]
jinja2     = ">=3.1"
weasyprint = ">=62"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
jupyterlab = ">=4.0"
ipywidgets = ">=8.0"
nbformat   = ">=5.9"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest      = ">=8.0"
pytest-cov  = ">=5.0"
ruff        = ">=0.4"
mypy        = ">=1.10"
jinja2      = ">=3.1"   # needed for HTML export in tests

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
ignore = ["D203", "D212", "ANN101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=drought_forecast_eval --cov-report=term-missing -v"
filterwarnings = ["ignore::DeprecationWarning"]
